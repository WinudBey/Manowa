  <script>
    (function () {
      'use strict';

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function slugify(text) {
        const trMap = {
          ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u',
          Ç: 'c', Ğ: 'g', İ: 'i', Ö: 'o', Ş: 's', Ü: 'u'
        };
        const replaced = String(text || '')
          .replace(/[çğıöşüÇĞİÖŞÜ]/g, function (ch) { return trMap[ch] || ch; })
          .toLowerCase();
        return replaced.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'seri';
      }

      function getVal(id, fallback) {
        var el = document.getElementById(id);
        return (el && el.value) ? el.value.trim() : (fallback || '');
      }

      function switchTab(mode) {
        var isSeries = mode === 'series';
        var tabSeries = document.getElementById('mpg-tab-series');
        var tabChapter = document.getElementById('mpg-tab-chapter');
        var panelSeries = document.getElementById('mpg-panel-series');
        var panelChapter = document.getElementById('mpg-panel-chapter');

        if (tabSeries) {
          tabSeries.classList.toggle('active', isSeries);
          tabSeries.setAttribute('aria-selected', isSeries ? 'true' : 'false');
        }
        if (tabChapter) {
          tabChapter.classList.toggle('active', !isSeries);
          tabChapter.setAttribute('aria-selected', !isSeries ? 'true' : 'false');
        }
        if (panelSeries) panelSeries.classList.toggle('hidden', !isSeries);
        if (panelChapter) panelChapter.classList.toggle('hidden', isSeries);

        if (isSeries) {
          generateSeries();
        } else {
          generateChapter();
        }
      }

      function generateSeries() {
        var title = getVal('mpg-series-title', 'Yeni Seri');
        var id = slugify(title);
        var altTitle = getVal('mpg-series-alt-title', '');
        var sourceLang = getVal('mpg-source-lang', 'KR');
        var status = getVal('mpg-series-status', 'Devam Ediyor');
        var readerMode = getVal('mpg-reader-mode', 'webtoon');
        var cover = getVal('mpg-series-cover', 'https://placehold.co/600x800/1e1b4b/ffffff?text=Kapak');
        var author = getVal('mpg-series-author', '');
        var artist = getVal('mpg-series-artist', '');
        var translator = getVal('mpg-series-translator', 'Manowa Çeviri');
        var editor = getVal('mpg-series-editor', 'Manowa Editör');
        var year = getVal('mpg-series-year', '');
        var rawGenres = getVal('mpg-series-genres', 'Aksiyon, Fantastik');
        var synopsis = getVal('mpg-series-synopsis', 'Seri özeti yakında eklenecektir.');

        var genreList = rawGenres.split(',').map(function (g) { return g.trim(); }).filter(Boolean);
        var typeMap = { KR: 'Manhwa', JP: 'Manga', CN: 'Manhua', EN: 'Novel' };
        var type = typeMap[sourceLang] || 'Manhwa';

        var metaRows = [];
        if (author) metaRows.push('    <p><strong>Yazar:</strong> <span>' + escapeHtml(author) + '</span></p>');
        if (artist) metaRows.push('    <p><strong>Çizer:</strong> <span>' + escapeHtml(artist) + '</span></p>');
        if (translator) metaRows.push('    <p><strong>Çevirmen:</strong> <span>' + escapeHtml(translator) + '</span></p>');
        if (editor) metaRows.push('    <p><strong>Editör:</strong> <span>' + escapeHtml(editor) + '</span></p>');
        if (year) metaRows.push('    <p><strong>Yıl / Stüdyo:</strong> <span>' + escapeHtml(year) + '</span></p>');
        if (altTitle) metaRows.push('    <p><strong>Diğer İsimler:</strong> <span>' + escapeHtml(altTitle) + '</span></p>');
        var metaHtml = metaRows.length > 0 ? '  <div class="series-meta-info">\n' + metaRows.join('\n') + '\n  </div>' : '';

        var htmlParts = [
          '<!-- MANOWA SERI TANITIM KODU -->',
          '<div id="actual-series-tag" style="display:none;">' + escapeHtml(title) + '</div>',
          '<div class="manowa-series-post"',
          '  data-series-id="' + escapeHtml(id) + '"',
          '  data-title="' + escapeHtml(title) + '"',
          '  data-alt-title="' + escapeHtml(altTitle) + '"',
          '  data-source-lang="' + escapeHtml(sourceLang) + '"',
          '  data-type="' + escapeHtml(type) + '"',
          '  data-reader-mode="' + escapeHtml(readerMode) + '"',
          '  data-status="' + escapeHtml(status) + '"',
          '  data-author="' + escapeHtml(author) + '"',
          '  data-artist="' + escapeHtml(artist) + '"',
          '  data-translator="' + escapeHtml(translator) + '"',
          '  data-editor="' + escapeHtml(editor) + '"',
          '  data-year="' + escapeHtml(year) + '"',
          '  data-genres="' + escapeHtml(genreList.join(',')) + '"',
          '  data-cover="' + escapeHtml(cover) + '">',
          '  <img src="' + escapeHtml(cover) + '" alt="' + escapeHtml(title) + '" />'
        ];

        if (metaHtml) htmlParts.push(metaHtml);

        htmlParts.push(
          '  <div class="synopsis-box">',
          '    <h3>Özet</h3>',
          '    <p class="manowa-synopsis">' + escapeHtml(synopsis) + '</p>',
          '  </div>',
          '</div>'
        );

        var labelParts = ['Seri', type, status].concat(genreList).concat([title]).filter(Boolean);
        var uniqueLabels = [];
        for (var i = 0; i < labelParts.length; i++) {
          if (uniqueLabels.indexOf(labelParts[i]) === -1) uniqueLabels.push(labelParts[i]);
        }

        var outEl = document.getElementById('mpg-code-output');
        var labelsEl = document.getElementById('mpg-labels-info');
        if (outEl) outEl.value = htmlParts.join('\n');
        if (labelsEl) labelsEl.textContent = 'Önerilen Blogger Etiketleri: ' + uniqueLabels.join(', ');
      }

      function generateChapter() {
        var seriesTitle = getVal('mpg-chapter-series-title', '') || getVal('mpg-series-title', 'Yeni Seri');
        var seriesId = slugify(seriesTitle);
        var chapterNumber = Number(getVal('mpg-chapter-num', '1')) || 1;
        var chapterId = seriesId + '-bolum-' + chapterNumber;
        var customTitle = getVal('mpg-chapter-title', '');
        var title = customTitle || (seriesTitle + ' Bölüm ' + chapterNumber);
        var readerMode = getVal('mpg-chapter-reader-mode', 'webtoon');
        var translatorNote = getVal('mpg-translator-note', '');
        var rawPages = getVal('mpg-pages-input', '');

        var pages = rawPages.split(/[\r\n,]+/).map(function (u) { return u.trim(); }).filter(Boolean);

        var pageImgsHtml = pages.map(function (url, idx) {
          return '    <div class="separator" data-carousel-item=""><img class="manowa-page-img" data-index="' + idx + '" src="' + escapeHtml(url) + '" alt="' + escapeHtml(title) + ' - Sayfa ' + (idx + 1) + '" loading="lazy" /></div>';
        }).join('\n');

        var htmlParts = [
          '<!-- MANOWA BOLUM OKUMA KODU -->',
          '<div class="manowa-chapter-post"',
          '  data-series-id="' + escapeHtml(seriesId) + '"',
          '  data-chapter-id="' + escapeHtml(chapterId) + '"',
          '  data-chapter-number="' + chapterNumber + '"',
          '  data-chapter-title="' + escapeHtml(title) + '"',
          '  data-reader-mode="' + escapeHtml(readerMode) + '"',
          '  data-translator-note="' + escapeHtml(translatorNote) + '">',
          '  <div class="manowa-pages-data">',
          pageImgsHtml,
          '  </div>',
          '</div>'
        ];

        var labels = 'Bölüm, ' + seriesTitle;
        var outEl = document.getElementById('mpg-code-output');
        var labelsEl = document.getElementById('mpg-labels-info');
        if (outEl) outEl.value = htmlParts.join('\n');
        if (labelsEl) labelsEl.textContent = 'Önerilen Blogger Etiketleri: ' + labels;
      }

      function copyCode() {
        var outEl = document.getElementById('mpg-code-output');
        var copyBtn = document.getElementById('mpg-copy-label');
        if (!outEl || !outEl.value) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(outEl.value).then(function () {
            if (copyBtn) {
              copyBtn.textContent = 'Kopyalandı! ✓';
              setTimeout(function () { copyBtn.textContent = 'Kodu Kopyala'; }, 2000);
            }
          });
        } else {
          outEl.select();
          document.execCommand('copy');
          if (copyBtn) {
            copyBtn.textContent = 'Kopyalandı! ✓';
            setTimeout(function () { copyBtn.textContent = 'Kodu Kopyala'; }, 2000);
          }
        }
      }

      // Event Bağlantıları
      var tabSeries = document.getElementById('mpg-tab-series');
      var tabChapter = document.getElementById('mpg-tab-chapter');
      var btnGenSeries = document.getElementById('mpg-btn-generate-series');
      var btnGenChapter = document.getElementById('mpg-btn-generate-chapter');
      var btnCopy = document.getElementById('mpg-btn-copy');
      var seriesTitleInput = document.getElementById('mpg-series-title');

      if (tabSeries) tabSeries.addEventListener('click', function () { switchTab('series'); });
      if (tabChapter) tabChapter.addEventListener('click', function () { switchTab('chapter'); });
      if (btnGenSeries) btnGenSeries.addEventListener('click', generateSeries);
      if (btnGenChapter) btnGenChapter.addEventListener('click', generateChapter);
      if (btnCopy) btnCopy.addEventListener('click', copyCode);

      if (seriesTitleInput) {
        seriesTitleInput.addEventListener('input', function (e) {
          var chInput = document.getElementById('mpg-chapter-series-title');
          if (chInput && (!chInput.value || chInput.value === 'Solo Leveling' || chInput.value === 'Yeni Seri')) {
            chInput.value = e.target.value;
          }
        });
      }

      // İlk yükleme
      generateSeries();
    })();
  </script>
</div>
