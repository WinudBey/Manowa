name: Release — Otomatik Tema Derleme ve Yayınlama

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Temayı Derle ve Releases Kısmında Yayınla
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Birim Testlerini Çalıştır
        run: npm test

      - name: Temayı Derle (dist/theme.xml ve dist/preview.html)
        run: npm run build

      - name: Sürüm Bilgilerini Belirle
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            BASE_VER=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
            HIGHEST_TAG=$(git tag -l "v${BASE_VER}.*" --sort=-v:refname | head -n 1)
            if [[ -n "${HIGHEST_TAG}" ]]; then
              LAST_PATCH="${HIGHEST_TAG##*.}"
              if [[ "${LAST_PATCH}" =~ ^[0-9]+$ ]]; then
                NEXT_PATCH=$((LAST_PATCH + 1))
              else
                NEXT_PATCH=1
              fi
            else
              NEXT_PATCH=1
            fi
            TAG="v${BASE_VER}.${NEXT_PATCH}"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=Manowa Blogger Teması ${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_msg=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release Oluştur veya Güncelle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          COMMIT_MSG: ${{ steps.meta.outputs.commit_msg }}
        run: |
          NOTES="### 📦 Manowa Blogger Teması (${TAG})
          Bu sürüm GitHub Actions tarafından otomatik olarak test edilmiş ve derlenmiştir.

          #### 📥 İndirilebilir Dosyalar
          * **\`theme.xml\`** — Blogger yönetim paneline (*Tema > Geri Yükle*) doğrudan yüklenecek canlı tema dosyası (geliştirici araçları arındırılmıştır).
          * **\`preview.html\`** — Tarayıcıda yerel olarak test edebileceğiniz ve Gönderi Oluşturucu aracını içeren önizleme dosyası.

          #### 🔗 Son Değişiklik
          * Commit: \`${GITHUB_SHA::7}\` — ${COMMIT_MSG}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Mevcut sürüm (${TAG}) güncelleniyor..."
            gh release upload "${TAG}" dist/theme.xml dist/preview.html --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --latest
          else
            echo "Yeni sürüm (${TAG}) oluşturuluyor..."
            gh release create "${TAG}" dist/theme.xml dist/preview.html \
              --title "${TITLE}" \
              --notes "${NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi
